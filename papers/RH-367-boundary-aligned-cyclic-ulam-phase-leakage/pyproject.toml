[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rh367-boundary-aligned-cyclic-ulam"
version = "0.1.0"
description = "Exact finite ledgers for the RH-367 boundary-aligned cyclic-Ulam theorem"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
