[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-history-realization-audit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.pytest.ini_options]
pythonpath = ["src", "../RH-172-canonical-polar-reset-memory-realization/src", "../RH-173-normalized-history-cocycle/src"]
testpaths = ["tests"]
