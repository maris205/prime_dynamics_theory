[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rh373-composite-clock-capacity"
version = "0.1.0"
description = "Exact q=180 phase-selector certificate for the RH-366 Mobius capacity floor"
