[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rh385-polylogarithmic-clock-phasewise-memory-uniformization"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4.18"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
